[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marcus-offensive-cad"
version = "4.0.0"
description = "Executable football knowledge database and deterministic card renderer"
requires-python = ">=3.10"
dependencies = ["cairosvg>=2.7", "fastapi>=0.110", "pypdf>=5.0", "uvicorn[standard]>=0.29"]

[project.scripts]
marcus-cad = "marcus_cad.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
